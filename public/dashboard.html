<!DOCTYPE html>
<html>
<head>

  <title>Employee Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =====================================================
       PROFESSIONAL OFFICE FONTS
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       CORPORATE OFFICE DESIGN SYSTEM
    ===================================================== */

    :root{

      --page:#F5F5F3;

      --white:#FFFFFF;

      --surface:#FAFAF9;

      --heading:#252525;

      --text:#303030;

      --secondary:#5F6368;

      --muted:#85898D;

      --border:#DDDFE2;

      --border-dark:#C9CCCF;

      --accent:#2F6B4F;

      --accent-dark:#285B43;

      --accent-soft:#EDF4EF;

      --accent-border:#D3E2D8;

      --table-head:#303030;

      --table-total:#F0F0ED;

      --shadow-sm:
        0 1px 3px rgba(0,0,0,.04);

      --shadow:
        0 4px 14px rgba(0,0,0,.06);

    }


    /* =====================================================
       RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    html{
      scroll-behavior:smooth;
    }


    body{

      font-family:'Inter',sans-serif;

      background:var(--page);

      color:var(--text);

      min-height:100vh;

      overflow-x:hidden;

      -webkit-font-smoothing:antialiased;

      text-rendering:optimizeLegibility;

    }


    button,
    input,
    textarea{

      font-family:'Inter',sans-serif;

    }


    button{

      -webkit-tap-highlight-color:transparent;

    }


    /* =====================================================
       MAIN
    ===================================================== */

    .main{

      width:100%;

      max-width:790px;

      margin:0 auto;

      padding:52px 34px 54px;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar{

      margin-bottom:40px;

      padding-bottom:24px;

      border-bottom:1px solid var(--border);

    }


    .topbar::before{

      content:"";

      display:block;

      width:34px;

      height:3px;

      background:var(--accent);

      margin-bottom:17px;

      border-radius:3px;

    }


    .topbar h1{

      font-family:'Manrope',sans-serif;

      font-size:42px;

      line-height:1.1;

      letter-spacing:-1.5px;

      font-weight:800;

      color:var(--heading);

    }


    /* =====================================================
       LABELS
    ===================================================== */

    .field-label,
    .projects-title{

      display:block;

      font-family:'Inter',sans-serif;

      font-size:13px;

      line-height:1.4;

      font-weight:600;

      color:var(--text);

      margin-bottom:8px;

      letter-spacing:.05px;

    }


    /* =====================================================
       DATE
    ===================================================== */

    .date-section{

      margin-bottom:27px;

    }


    .date-row{

      display:flex;

      align-items:center;

      gap:8px;

      position:relative;

    }


    .date-display{

      flex:1;

      min-width:0;

      height:44px;

      display:flex;

      align-items:center;

      padding:0 13px;

      background:var(--white);

      border:1px solid var(--border);

      border-radius:6px;

      font-size:14px;

      font-weight:500;

      color:var(--text);

      cursor:pointer;

      text-align:left;

      box-shadow:var(--shadow-sm);

      transition:

        border-color .18s ease,

        box-shadow .18s ease;

    }


    .date-display:hover{

      border-color:var(--border-dark);

      box-shadow:var(--shadow);

    }


    .date-display:focus{

      outline:none;

      border-color:#A7AAA8;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.08);

    }


    .date-edit{

      width:44px;

      height:44px;

      flex-shrink:0;

      display:flex;

      align-items:center;

      justify-content:center;

      border:1px solid var(--border);

      border-radius:6px;

      background:var(--white);

      cursor:pointer;

      box-shadow:var(--shadow-sm);

      transition:

        background .18s ease,

        border-color .18s ease;

    }


    .date-edit:hover{

      background:#F1F2F0;

      border-color:var(--border-dark);

    }


    .date-edit svg{

      width:18px;

      height:18px;

      stroke:#5F6368;

      stroke-width:1.8;

      fill:none;

    }


    #workDate{

      position:absolute;

      left:0;

      top:0;

      width:calc(100% - 52px);

      height:44px;

      opacity:0;

      cursor:pointer;

      z-index:5;

      border:0;

    }


    /* =====================================================
       DAY NOTE
    ===================================================== */

    .day-section{

      margin-bottom:29px;

    }


    #dayNote{

      display:block;

      width:100%;

      height:145px;

      padding:13px 14px;

      background:var(--white);

      border:1px solid var(--border);

      border-radius:6px;

      outline:none;

      resize:none;

      font-size:14px;

      line-height:1.6;

      font-weight:400;

      color:var(--text);

      box-shadow:var(--shadow-sm);

      transition:

        border-color .18s ease,

        box-shadow .18s ease;

    }


    #dayNote:hover{

      border-color:var(--border-dark);

    }


    #dayNote:focus{

      border-color:#A7AAA8;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.08);

    }


    #dayNote::placeholder{

      color:#A0A3A6;

    }


    /* =====================================================
       PROJECTS
    ===================================================== */

    .projects-section{

      margin-bottom:30px;

    }


    .projects-table{

      width:100%;

      border-collapse:separate;

      border-spacing:0 5px;

    }


    .projects-table th,
    .projects-table td{

      height:58px;

      padding:6px 14px;

      text-align:left;

      vertical-align:middle;

      font-size:13px;

    }


    /* =====================================================
       TABLE HEADER
    ===================================================== */

    .projects-table th{

      height:40px;

      background:var(--table-head);

      color:#FFFFFF;

      font-size:12px;

      font-weight:600;

      letter-spacing:.2px;

      text-transform:uppercase;

    }


    .projects-table th:first-child{

      border-radius:5px 0 0 5px;

    }


    .projects-table th:last-child{

      border-radius:0 5px 5px 0;

    }


    .projects-table th:first-child,
    .projects-table td:first-child{

      width:65%;

    }


    .projects-table th:last-child,
    .projects-table td:last-child{

      width:35%;

    }


    /* =====================================================
       PROJECT ROWS
    ===================================================== */

    .projects-table tbody tr td{

      background:var(--white);

      border-top:1px solid var(--border);

      border-bottom:1px solid var(--border);

      transition:

        background .15s ease,

        border-color .15s ease;

    }


    .projects-table tbody tr td:first-child{

      border-left:1px solid var(--border);

      border-radius:5px 0 0 5px;

    }


    .projects-table tbody tr td:last-child{

      border-right:1px solid var(--border);

      border-radius:0 5px 5px 0;

    }


    .projects-table tbody tr:hover td{

      background:#FCFCFB;

      border-color:#D4D6D8;

    }


    .project-cell{

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

      color:var(--text);

      font-weight:500;

    }


    /* =====================================================
       SCROLLING TIME PICKER
    ===================================================== */

    .hours-cell{

      padding:4px 8px !important;

    }


    .time-input{

      width:100%;

      height:50px;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:2px;

      background:#F7F7F6;

      border:1px solid var(--border);

      border-radius:6px;

      overflow:hidden;

      transition:

        border-color .18s ease,

        background .18s ease,

        box-shadow .18s ease;

    }


    .time-input:focus-within{

      background:#FFFFFF;

      border-color:#AEB3B0;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.06);

    }


    /* =====================================================
       NUMBER WHEELS
    ===================================================== */

    .time-wheel{

      position:relative;

      width:48px;

      height:50px;

      overflow-y:auto;

      overflow-x:hidden;

      scroll-snap-type:y mandatory;

      scrollbar-width:none;

      -ms-overflow-style:none;

      overscroll-behavior:contain;

      touch-action:pan-y;

      cursor:ns-resize;

    }


    .time-wheel::-webkit-scrollbar{

      display:none;

    }


    /* =====================================================
       WHEEL NUMBERS
    ===================================================== */

    .time-wheel-item{

      width:100%;

      height:50px;

      display:flex;

      align-items:center;

      justify-content:center;

      scroll-snap-align:center;

      font-family:'Inter',sans-serif;

      font-size:13px;

      font-weight:500;

      color:#A0A3A6;

      user-select:none;

      cursor:pointer;

      transition:

        color .12s ease,

        font-size .12s ease,

        font-weight .12s ease;

    }


    .time-wheel-item.selected{

      color:#252525;

      font-size:15px;

      font-weight:700;

    }


    /* =====================================================
       SPACERS
    ===================================================== */

    .time-wheel-item.spacer{

      pointer-events:none;

      visibility:hidden;

    }


    /* =====================================================
       CENTER INDICATOR
    ===================================================== */

    .time-wheel::before{

      content:"";

      position:absolute;

      left:3px;

      right:3px;

      top:50%;

      height:34px;

      transform:translateY(-50%);

      border-top:1px solid #D5D7D5;

      border-bottom:1px solid #D5D7D5;

      pointer-events:none;

      z-index:3;

      border-radius:3px;

    }


    /* =====================================================
       COLON
    ===================================================== */

    .time-colon{

      width:12px;

      height:50px;

      display:flex;

      align-items:center;

      justify-content:center;

      color:#707579;

      font-size:14px;

      font-weight:700;

      z-index:4;

    }


    /* =====================================================
       HIDDEN INPUTS
    ===================================================== */

    .time-input input{

      position:absolute;

      width:1px;

      height:1px;

      padding:0;

      border:0;

      opacity:0;

      pointer-events:none;

    }


    /* =====================================================
       TOTAL
    ===================================================== */

    .total-row td{

      background:var(--table-total) !important;

      border-top:1px solid var(--border-dark) !important;

      border-bottom:1px solid var(--border-dark) !important;

      height:42px;

      color:var(--heading);

      font-weight:600;

    }


    .total-row td:first-child{

      border-left:1px solid var(--border-dark) !important;

      border-radius:5px 0 0 5px;

    }


    .total-row td:last-child{

      border-right:1px solid var(--border-dark) !important;

      border-radius:0 5px 5px 0;

    }


    .total-label{

      text-align:right !important;

      padding-right:14px !important;

      font-size:12px !important;

      text-transform:uppercase;

      letter-spacing:.35px;

      color:#5F6368;

    }


    .total-time{

      font-size:14px;

      font-weight:700;

      font-variant-numeric:tabular-nums;

      color:var(--heading);

    }


    /* =====================================================
       SUBMIT
    ===================================================== */

    .submit-btn{

      display:block;

      width:100%;

      height:45px;

      padding:0 18px;

      border:0;

      border-radius:6px;

      background:var(--accent);

      color:#FFFFFF;

      font-family:'Inter',sans-serif;

      font-size:14px;

      font-weight:600;

      letter-spacing:.1px;

      cursor:pointer;

      box-shadow:

        0 3px 8px rgba(47,107,79,.15);

      transition:

        background .18s ease,

        box-shadow .18s ease,

        transform .18s ease;

      margin-bottom:9px;

    }


    .submit-btn:hover{

      background:var(--accent-dark);

      transform:translateY(-1px);

      box-shadow:

        0 5px 12px rgba(47,107,79,.18);

    }


    .submit-btn:active{

      transform:translateY(0);

    }


    .submit-btn:disabled{

      opacity:.7;

      cursor:wait;

      transform:none;

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .bottom-buttons{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:9px;

    }


    .nav-btn{

      height:43px;

      border:1px solid var(--border);

      border-radius:6px;

      background:var(--white);

      color:#4D5154;

      font-size:13px;

      font-weight:600;

      cursor:pointer;

      box-shadow:var(--shadow-sm);

      transition:

        background .18s ease,

        border-color .18s ease,

        color .18s ease;

    }


    .nav-btn:hover{

      background:#F1F2F0;

      border-color:var(--border-dark);

      color:var(--heading);

    }


    .nav-btn:active{

      background:#EDEDEB;

    }


    /* =====================================================
       HIDDEN DATA
    ===================================================== */

    .task-meta{

      display:none;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:700px){

      .main{

        padding:44px 28px 45px;

      }


      .topbar h1{

        font-size:38px;

      }

    }


    @media(max-width:600px){

      .main{

        max-width:none;

        padding:36px 22px 40px;

      }


      .topbar{

        margin-bottom:32px;

      }


      .topbar h1{

        font-size:35px;

        letter-spacing:-1.2px;

      }


      #dayNote{

        height:135px;

      }


      .projects-table th,
      .projects-table td{

        padding-left:10px;

        padding-right:10px;

      }


      .projects-table th{

        font-size:11px;

      }


      .projects-table td{

        font-size:12px;

      }


      .time-wheel{

        width:44px;

      }

    }


    @media(max-width:430px){

      .main{

        padding-left:16px;

        padding-right:16px;

      }


      .topbar h1{

        font-size:32px;

        letter-spacing:-1px;

      }


      .date-display{

        font-size:13px;

      }


      .projects-table{

        border-spacing:0 4px;

      }


      .projects-table th,
      .projects-table td{

        font-size:11px;

      }


      .projects-table th:first-child,
      .projects-table td:first-child{

        width:58%;

      }


      .projects-table th:last-child,
      .projects-table td:last-child{

        width:42%;

      }


      .time-input{

        height:48px;

      }


      .time-wheel{

        width:40px;

        height:48px;

      }


      .time-wheel-item{

        height:48px;

      }


      .time-wheel::before{

        height:32px;

      }


      .time-colon{

        height:48px;

      }


      .submit-btn{

        height:44px;

      }


      .nav-btn{

        height:42px;

        font-size:12px;

      }

    }


    /* =====================================================
       ACCESSIBILITY
    ===================================================== */

    .time-wheel:focus{

      outline:none;

    }


    .time-wheel:focus-visible{

      box-shadow:
        inset 0 0 0 2px rgba(47,107,79,.25);

      border-radius:4px;

    }


    @media(prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{

        transition:none !important;

        animation:none !important;

        scroll-behavior:auto !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN
  ===================================================== -->

  <div class="main">


    <!-- =====================================================
         GREETING
    ===================================================== -->

    <div class="topbar">

      <h1 id="welcomeText">
        Hey, Employee
      </h1>

    </div>


    <!-- =====================================================
         DATE
    ===================================================== -->

    <section class="date-section">

      <label class="field-label">
        Date
      </label>


      <div class="date-row">

        <div
          class="date-display"
          id="dateDisplay"
          aria-label="Change work date"
        >
          Loading date...
        </div>


        <button
          type="button"
          class="date-edit"
          id="dateEdit"
          aria-label="Edit date"
          title="Change date"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M12 20h9"></path>

            <path
              d="M16.5 3.5a2.121 2.121 0 0 1 3 3L8 18l-4 1 1-4Z"
            ></path>

          </svg>

        </button>


        <input
          type="date"
          id="workDate"
        >

      </div>

    </section>


    <!-- =====================================================
         DAY NOTE
    ===================================================== -->

    <section class="day-section">

      <label
        class="field-label"
        for="dayNote"
      >
        How was your day?
      </label>


      <textarea
        id="dayNote"
        placeholder="Add a brief note about your day..."
      ></textarea>

    </section>


    <!-- =====================================================
         PROJECTS
    ===================================================== -->

    <section class="projects-section">

      <label class="projects-title">
        How many hours spent on what projects?
      </label>


      <table class="projects-table">

        <thead>

          <tr>

            <th>
              Projects
            </th>

            <th>
              Hrs
            </th>

          </tr>

        </thead>


        <tbody id="tasks"></tbody>


        <tfoot>

          <tr class="total-row">

            <td class="total-label">
              Total
            </td>


            <td
              class="total-time"
              id="totalDisplay"
            >
              00:00
            </td>

          </tr>

        </tfoot>

      </table>


      <!-- Existing logic -->

      <span
        id="taskCount"
        class="task-meta"
      >
        0
      </span>


      <span
        id="taskTotal"
        class="task-meta"
      >
        0
      </span>


      <span
        id="totalHours"
        class="task-meta"
      >
        0
      </span>

    </section>


    <!-- =====================================================
         SUBMIT
    ===================================================== -->

    <button
      class="submit-btn"
      id="submitBtn"
      type="button"
      onclick="submitWork()"
    >
      Submit
    </button>


    <!-- =====================================================
         HISTORY / PROFILE
    ===================================================== -->

    <div class="bottom-buttons">

      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='history.html'"
      >
        History
      </button>


      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='profile.html'"
      >
        Profile
      </button>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>


    /* =====================================================
       USER
    ===================================================== */

    const user =
      JSON.parse(
        localStorage.getItem("user")
      );


    if(user){

      document.getElementById(
        "welcomeText"
      ).innerText =
        `Hey, ${user.id}`;

    }


    /* =====================================================
       DATE
    ===================================================== */

    const workDate =
      document.getElementById(
        "workDate"
      );


    const dateDisplay =
      document.getElementById(
        "dateDisplay"
      );


    const dateEdit =
      document.getElementById(
        "dateEdit"
      );


    function formatDate(dateString){

      if(!dateString) return "";


      const date =
        new Date(
          dateString +
          "T00:00:00"
        );


      return date.toLocaleDateString(
        "en-US",
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );

    }


    function updateDateDisplay(){

      dateDisplay.innerText =
        formatDate(
          workDate.value
        );

    }


    workDate.value =
      new Date()
        .toISOString()
        .split("T")[0];


    updateDateDisplay();


    function openDatePicker(event){

      if(event){

        event.preventDefault();

        event.stopPropagation();

      }


      try{

        if(
          typeof workDate.showPicker ===
          "function"
        ){

          workDate.showPicker();

          return;

        }

      }catch(error){

        console.log(
          "showPicker unavailable:",
          error
        );

      }


      workDate.focus();

      workDate.click();

    }


    dateEdit.addEventListener(
      "click",
      openDatePicker
    );


    workDate.addEventListener(
      "change",
      updateDateDisplay
    );


    /* =====================================================
       TOTAL FROM INPUTS
    ===================================================== */

    function updateTotalFromInputs(){

      let totalMinutes = 0;


      document
        .querySelectorAll(".task-card")
        .forEach(card => {

          const hrs =
            Number(
              card.querySelector(
                ".hrs"
              )?.value || 0
            );


          const mins =
            Number(
              card.querySelector(
                ".mins"
              )?.value || 0
            );


          totalMinutes +=
            (hrs * 60) +
            mins;

        });


      updateTotalDisplay(
        totalMinutes
      );

    }


    /* =====================================================
       LOAD TASKS
    ===================================================== */

    async function loadTasks(){

      const user =
        JSON.parse(
          localStorage.getItem("user")
        );


      const res =
        await fetch(
          `/tasks/${user.id}`
        );


      const tasks =
        await res.json();


      console.log(tasks);


      document.getElementById(
        "taskCount"
      ).innerText =
        tasks.length;


      document.getElementById(
        "taskTotal"
      ).innerText =
        tasks.length;


      const container =
        document.getElementById(
          "tasks"
        );


      container.innerHTML = "";


      if(!tasks.length){

        container.innerHTML = `

          <tr>

            <td
              colspan="2"
              style="
                height:55px;
                color:#85898D;
                text-align:center;
                background:#FFFFFF;
                border:1px solid #DDDFE2;
                border-radius:5px;
              "
            >
              No tasks assigned
            </td>

          </tr>

        `;


        return;

      }


      tasks.forEach(task => {

        const row =
          document.createElement(
            "tr"
          );


        row.className =
          "task-card";


        row.innerHTML = `

          <td class="project-cell">

            <span class="task-name">
              ${task.project}
            </span>


            <span
              class="task-task task-meta"
              aria-hidden="true"
            >
              ${task.task}
            </span>


            <span
              class="task-client task-meta"
              aria-hidden="true"
            >
              ${task.client}
            </span>

          </td>


          <td class="hours-cell">

            <div class="time-input">


              <!-- =========================================
                   HOURS
                   00 - 23
              ========================================== -->

              <div
                class="time-wheel hours-wheel"
                data-type="hours"
                tabindex="0"
                aria-label="Select hours"
              >

                <div
                  class="time-wheel-item spacer"
                ></div>


                ${Array.from(
                  {length:24},
                  (_,i)=>`

                    <div
                      class="time-wheel-item"
                      data-value="${i}"
                    >
                      ${String(i).padStart(2,"0")}
                    </div>

                  `
                ).join("")}


                <div
                  class="time-wheel-item spacer"
                ></div>

              </div>


              <!-- COLON -->

              <span class="time-colon">
                :
              </span>


              <!-- =========================================
                   MINUTES
                   00 - 59
              ========================================== -->

              <div
                class="time-wheel minutes-wheel"
                data-type="minutes"
                tabindex="0"
                aria-label="Select minutes"
              >

                <div
                  class="time-wheel-item spacer"
                ></div>


                ${Array.from(
                  {length:60},
                  (_,i)=>`

                    <div
                      class="time-wheel-item"
                      data-value="${i}"
                    >
                      ${String(i).padStart(2,"0")}
                    </div>

                  `
                ).join("")}


                <div
                  class="time-wheel-item spacer"
                ></div>

              </div>


              <!-- =========================================
                   ORIGINAL INPUTS
              ========================================== -->

              <input
                type="number"
                min="0"
                max="23"
                class="hrs"
                aria-hidden="true"
                tabindex="-1"
              >


              <input
                type="number"
                min="0"
                max="59"
                class="mins"
                aria-hidden="true"
                tabindex="-1"
              >

            </div>

          </td>

        `;


        container.appendChild(
          row
        );

      });


      setupTimeWheels();

    }


    /* =====================================================
       TIME WHEEL SYSTEM
    ===================================================== */

    function setupTimeWheels(){

      document
        .querySelectorAll(
          ".time-input"
        )
        .forEach(container => {


          const hoursWheel =
            container.querySelector(
              ".hours-wheel"
            );


          const minutesWheel =
            container.querySelector(
              ".minutes-wheel"
            );


          const hrsInput =
            container.querySelector(
              ".hrs"
            );


          const minsInput =
            container.querySelector(
              ".mins"
            );


          /* =============================================
             FIND CLOSEST NUMBER
          ============================================= */

          function getClosestItem(wheel){

            const items =
              [
                ...wheel.querySelectorAll(
                  ".time-wheel-item[data-value]"
                )
              ];


            if(!items.length){

              return null;

            }


            const center =
              wheel.scrollTop +
              wheel.clientHeight / 2;


            let closest = null;

            let smallestDistance =
              Infinity;


            items.forEach(item => {

              const itemCenter =
                item.offsetTop +
                item.offsetHeight / 2;


              const distance =
                Math.abs(
                  center -
                  itemCenter
                );


              if(
                distance <
                smallestDistance
              ){

                smallestDistance =
                  distance;

                closest =
                  item;

              }

            });


            return closest;

          }


          /* =============================================
             UPDATE SELECTED
          ============================================= */

          function updateSelected(wheel){

            const selected =
              getClosestItem(
                wheel
              );


            if(!selected) return;


            const items =
              wheel.querySelectorAll(
                ".time-wheel-item[data-value]"
              );


            items.forEach(item => {

              item.classList.remove(
                "selected"
              );

            });


            selected.classList.add(
              "selected"
            );


            const value =
              Number(
                selected.dataset.value
              );


            if(
              wheel.dataset.type ===
              "hours"
            ){

              hrsInput.value =
                value;

            }else{

              minsInput.value =
                value;

            }


            updateTotalFromInputs();

          }


          /* =============================================
             SNAP TO NUMBER
          ============================================= */

          function snapWheel(wheel){

            const selected =
              getClosestItem(
                wheel
              );


            if(!selected) return;


            const target =
              selected.offsetTop -
              (
                wheel.clientHeight -
                selected.offsetHeight
              ) / 2;


            wheel.scrollTo({

              top:target,

              behavior:"smooth"

            });

          }


          /* =============================================
             HOURS SCROLL
          ============================================= */

          let hoursTimer;


          hoursWheel.addEventListener(
            "scroll",
            () => {

              updateSelected(
                hoursWheel
              );


              clearTimeout(
                hoursTimer
              );


              hoursTimer =
                setTimeout(
                  () => {

                    snapWheel(
                      hoursWheel
                    );

                  },
                  100
                );

            },
            {
              passive:true
            }
          );


          /* =============================================
             MINUTES SCROLL
          ============================================= */

          let minutesTimer;


          minutesWheel.addEventListener(
            "scroll",
            () => {

              updateSelected(
                minutesWheel
              );


              clearTimeout(
                minutesTimer
              );


              minutesTimer =
                setTimeout(
                  () => {

                    snapWheel(
                      minutesWheel
                    );

                  },
                  100
                );

            },
            {
              passive:true
            }
          );


          /* =============================================
             MOUSE WHEEL
          ============================================= */

          function wheelScroll(
            event,
            wheel
          ){

            event.preventDefault();


            const item =
              wheel.querySelector(
                ".time-wheel-item"
              );


            if(!item) return;


            const direction =
              event.deltaY > 0
                ? 1
                : -1;


            wheel.scrollBy({

              top:
                direction *
                item.offsetHeight,

              behavior:"smooth"

            });

          }


          hoursWheel.addEventListener(
            "wheel",
            event => {

              wheelScroll(
                event,
                hoursWheel
              );

            },
            {
              passive:false
            }
          );


          minutesWheel.addEventListener(
            "wheel",
            event => {

              wheelScroll(
                event,
                minutesWheel
              );

            },
            {
              passive:false
            }
          );


          /* =============================================
             KEYBOARD
          ============================================= */

          function keyboardScroll(
            event,
            wheel
          ){

            if(
              event.key !== "ArrowUp" &&
              event.key !== "ArrowDown"
            ){

              return;

            }


            event.preventDefault();


            const item =
              wheel.querySelector(
                ".time-wheel-item"
              );


            if(!item) return;


            const direction =
              event.key === "ArrowDown"
                ? 1
                : -1;


            wheel.scrollBy({

              top:
                direction *
                item.offsetHeight,

              behavior:"smooth"

            });

          }


          hoursWheel.addEventListener(
            "keydown",
            event => {

              keyboardScroll(
                event,
                hoursWheel
              );

            }
          );


          minutesWheel.addEventListener(
            "keydown",
            event => {

              keyboardScroll(
                event,
                minutesWheel
              );

            }
          );


          /* =============================================
             CLICK NUMBER
          ============================================= */

          container
            .querySelectorAll(
              ".time-wheel-item[data-value]"
            )
            .forEach(item => {

              item.addEventListener(
                "click",
                () => {

                  const wheel =
                    item.closest(
                      ".time-wheel"
                    );


                  const target =
                    item.offsetTop -
                    (
                      wheel.clientHeight -
                      item.offsetHeight
                    ) / 2;


                  wheel.scrollTo({

                    top:target,

                    behavior:"smooth"

                  });

                }
              );

            });


          /* =============================================
             START AT 00
          ============================================= */

          requestAnimationFrame(() => {


            const firstHour =
              hoursWheel.querySelector(
                ".time-wheel-item[data-value='0']"
              );


            const firstMinute =
              minutesWheel.querySelector(
                ".time-wheel-item[data-value='0']"
              );


            if(firstHour){

              hoursWheel.scrollTop =
                firstHour.offsetTop -
                (
                  hoursWheel.clientHeight -
                  firstHour.offsetHeight
                ) / 2;

            }


            if(firstMinute){

              minutesWheel.scrollTop =
                firstMinute.offsetTop -
                (
                  minutesWheel.clientHeight -
                  firstMinute.offsetHeight
                ) / 2;

            }


            updateSelected(
              hoursWheel
            );


            updateSelected(
              minutesWheel
            );

          });

        });

    }


    /* =====================================================
       TOTAL DISPLAY
    ===================================================== */

    function updateTotalDisplay(
      totalMinutes
    ){

      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const minutes =
        totalMinutes % 60;


      document.getElementById(
        "totalDisplay"
      ).innerText =

        String(hours).padStart(
          2,
          "0"
        )

        +

        ":"

        +

        String(minutes).padStart(
          2,
          "0"
        );

    }


    /* =====================================================
       SUBMIT WORK
    ===================================================== */

    async function submitWork(){

      const btn =
        document.getElementById(
          "submitBtn"
        );


      btn.disabled = true;


      btn.innerText =
        "Submitting...";


      const user =
        JSON.parse(
          localStorage.getItem("user")
        );


      const cards =
        document.querySelectorAll(
          ".task-card"
        );


      let tasks = [];


      let totalMinutes = 0;


      cards.forEach(card => {


        const taskName =
          card.querySelector(
            ".task-name"
          )?.innerText || "";


        const hrs =
          Number(
            card.querySelector(
              ".hrs"
            )?.value || 0
          );


        const mins =
          Number(
            card.querySelector(
              ".mins"
            )?.value || 0
          );


        totalMinutes +=
          (hrs * 60) +
          mins;


        if(taskName){

          tasks.push({

            project:
              card.querySelector(
                ".task-name"
              ).innerText,


            task:
              card.querySelector(
                ".task-task"
              ).innerText,


            hrs:hrs,


            mins:mins

          });

        }

      });


      const note =
        document.getElementById(
          "dayNote"
        ).value;


      await fetch(
        "/submit",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },


          body:JSON.stringify({

            action:"submit",

            user:user.id,

            tasks:tasks,

            note:note,

            workDate:
              document.getElementById(
                "workDate"
              ).value

          })

        }
      );


      /* Clear hour values */

      document
        .querySelectorAll(
          ".hrs"
        )
        .forEach(
          input =>
            input.value = ""
        );


      /* Clear minute values */

      document
        .querySelectorAll(
          ".mins"
        )
        .forEach(
          input =>
            input.value = ""
        );


      /* Clear note */

      document.getElementById(
        "dayNote"
      ).value = "";


      btn.innerText =
        "Submitted ✓";


      document.getElementById(
        "totalHours"
      ).innerText =
        (
          totalMinutes /
          60
        ).toFixed(1);


      updateTotalDisplay(
        totalMinutes
      );


      alert(
        "Submitted Successfully"
      );

    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadTasks();


  </script>
