<!DOCTYPE html>
<html>
<head>
  <title>Employee Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <style>

    /* ================= RESET ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#ffffff;
      color:#171717;
      overflow-x:hidden;
    }

    button,
    input,
    textarea{
      font-family:inherit;
    }

    /* ================= MAIN ================= */

    .main{
      width:100%;
      max-width:760px;
      margin:0 auto;
      padding:54px 34px 52px;
    }

    /* ================= GREETING ================= */

    .topbar{
      margin-bottom:42px;
    }

    .topbar h1{
      font-family:'Fredoka','Manrope',sans-serif;
      font-size:54px;
      line-height:1;
      letter-spacing:-1.8px;
      font-weight:700;
      color:#050505;
    }

    /* ================= DATE ================= */

    .date-section{
      margin-bottom:29px;
    }

    .field-label{
      display:block;
      font-size:17px;
      line-height:1.3;
      font-weight:400;
      margin-bottom:5px;
      color:#171717;
    }

    .date-row{
      display:flex;
      align-items:center;
      gap:9px;
      position:relative;
    }

    .date-display{
      flex:1;
      min-width:0;
      height:40px;
      display:flex;
      align-items:center;
      padding:0 14px;
      background:#e7e7e7;
      border:0;
      font-size:17px;
      color:#222;
      cursor:pointer;
      text-align:left;
    }

    .date-display:hover{
      background:#dedede;
    }

    .date-display:focus{
      outline:none;
      box-shadow:inset 0 0 0 1px #c8c8c8;
    }

    .date-edit{
      width:50px;
      height:40px;
      border:0;
      background:#eeeeee;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.2s ease;
    }

    .date-edit:hover{
      background:#dedede;
    }

    .date-edit svg{
      width:22px;
      height:22px;
      stroke:#111;
      stroke-width:2;
      fill:none;
    }

    #workDate{
      position:absolute;
      left:0;
      top:0;
      width:calc(100% - 59px);
      height:40px;
      opacity:0;
      cursor:pointer;
      z-index:5;
      border:0;
    }

    /* ================= DAY NOTE ================= */

    .day-section{
      margin-bottom:29px;
    }

    #dayNote{
      display:block;
      width:100%;
      height:177px;
      padding:14px;
      border:0;
      border-radius:0;
      outline:none;
      resize:none;
      background:#e7e7e7;
      font-size:16px;
      line-height:1.5;
      color:#222;
    }

    #dayNote:focus{
      box-shadow:inset 0 0 0 1px #c8c8c8;
    }

    #dayNote::placeholder{
      color:#777;
    }

    /* ================= PROJECTS ================= */

    .projects-section{
      margin-bottom:34px;
    }

    .projects-title{
      display:block;
      font-size:17px;
      line-height:1.3;
      font-weight:400;
      margin-bottom:7px;
    }

    .projects-table{
      width:100%;
      border-collapse:separate;
      border-spacing:5px 3px;
      margin-left:-5px;
      width:calc(100% + 10px);
    }

    .projects-table th,
    .projects-table td{
      height:30px;
      padding:3px 13px;
      text-align:left;
      vertical-align:middle;
      background:#e7e7e7;
      font-size:16px;
      font-weight:400;
    }

    .projects-table th{
      height:30px;
      background:#b9b9b9;
      color:#fff;
      font-weight:400;
    }

    .projects-table th:first-child,
    .projects-table td:first-child{
      width:65%;
    }

    .projects-table th:last-child,
    .projects-table td:last-child{
      width:35%;
    }

    .project-cell{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .hours-cell{
      padding:0 !important;
    }

    .time-input{
      width:100%;
      height:30px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding:0 13px;
      background:#e7e7e7;
    }

    .time-input input{
      width:27px;
      height:26px;
      padding:0;
      border:0;
      outline:none;
      background:transparent;
      color:#171717;
      font-size:16px;
      text-align:center;
      -moz-appearance:textfield;
    }

    .time-input input::-webkit-outer-spin-button,
    .time-input input::-webkit-inner-spin-button{
      -webkit-appearance:none;
      margin:0;
    }

    .time-input input::placeholder{
      color:#555;
      opacity:1;
    }

    .time-colon{
      margin:0 1px;
      font-size:16px;
      line-height:1;
    }

    .total-row td{
      background:#d0d0d0;
      height:30px;
    }

    .total-label{
      text-align:right !important;
      padding-right:14px !important;
    }

    .total-time{
      font-variant-numeric:tabular-nums;
    }

    /* ================= SUBMIT ================= */

    .submit-btn{
      display:block;
      width:100%;
      height:40px;
      padding:0 18px;
      border:0;
      border-radius:8px;
      background:#38b94b;
      color:#fff;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
      margin-bottom:7px;
    }

    .submit-btn:hover{
      background:#2fab42;
    }

    .submit-btn:disabled{
      opacity:.75;
      cursor:wait;
    }

    /* ================= NAV BUTTONS ================= */

    .bottom-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .nav-btn{
      height:40px;
      border:0;
      border-radius:8px;
      background:#505050;
      color:#fff;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    .nav-btn:hover{
      background:#3f3f3f;
    }

    /* ================= HIDDEN DATA ================= */

    .task-meta{
      display:none;
    }

    /* ================= DESKTOP ================= */

    @media(min-width:901px){
      .main{
        max-width:760px;
      }
    }

    /* ================= SMALL SCREENS ================= */

    @media(max-width:600px){

      .main{
        max-width:none;
        padding:38px 44px 44px;
      }

      .topbar{
        margin-bottom:42px;
      }

      .topbar h1{
        font-size:48px;
      }

      .projects-table th,
      .projects-table td{
        padding-left:13px;
        padding-right:13px;
      }

    }

    @media(max-width:430px){

      .main{
        padding-left:20px;
        padding-right:20px;
      }

      .topbar h1{
        font-size:42px;
        letter-spacing:-1.2px;
      }

      .projects-table th,
      .projects-table td{
        font-size:14px;
      }

      .time-input input{
        font-size:14px;
      }

      .nav-btn,
      .submit-btn{
        font-size:16px;
      }

    }

  </style>
</head>

<body>

  <!-- ================= MAIN ================= -->

  <div class="main">

    <!-- ================= GREETING ================= -->

    <div class="topbar">
      <h1 id="welcomeText">Hey, Employee</h1>
    </div>

    <!-- ================= DATE ================= -->

    <section class="date-section">

      <label class="field-label">Date</label>

      <div class="date-row">

        <div
          class="date-display"
          id="dateDisplay"
          aria-label="Change work date"
        >
          Loading date...
        </div>

        <button
          type="button"
          class="date-edit"
          id="dateEdit"
          aria-label="Edit date"
          title="Change date"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
          </svg>
        </button>

        <input type="date" id="workDate">

      </div>

    </section>

    <!-- ================= DAY NOTE ================= -->

    <section class="day-section">

      <label class="field-label" for="dayNote">How was your day?</label>

      <textarea
        id="dayNote"
        placeholder=""
      ></textarea>

    </section>

    <!-- ================= PROJECTS ================= -->

    <section class="projects-section">

      <label class="projects-title">How many hours spent on what projects?</label>

      <table class="projects-table">

        <thead>
          <tr>
            <th>Projects</th>
            <th>Hrs</th>
          </tr>
        </thead>

        <tbody id="tasks"></tbody>

        <tfoot>
          <tr class="total-row">
            <td class="total-label">Total</td>
            <td class="total-time" id="totalDisplay">00:00</td>
          </tr>
        </tfoot>

      </table>

      <!-- Kept for existing dashboard logic -->
      <span id="taskCount" class="task-meta">0</span>
      <span id="taskTotal" class="task-meta">0</span>
      <span id="totalHours" class="task-meta">0</span>

    </section>

    <!-- ================= SUBMIT ================= -->

    <button
      class="submit-btn"
      id="submitBtn"
      type="button"
      onclick="submitWork()"
    >
      Submit
    </button>

    <!-- ================= HISTORY / PROFILE ================= -->

    <div class="bottom-buttons">

      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='history.html'"
      >
        History
      </button>

      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='profile.html'"
      >
        Profile
      </button>

    </div>

  </div>

  <script>

    const user = JSON.parse(localStorage.getItem("user"));

    /* ================= USER ================= */

    if(user){
      document.getElementById("welcomeText").innerText =
        `Hey, ${user.id}`;
    }

    /* ================= DATE ================= */

    const workDate = document.getElementById("workDate");
    const dateDisplay = document.getElementById("dateDisplay");
    const dateEdit = document.getElementById("dateEdit");

    function formatDate(dateString){

      if(!dateString) return "";

      const date = new Date(dateString + "T00:00:00");

      return date.toLocaleDateString("en-US", {
        weekday:"long",
        month:"long",
        day:"numeric",
        year:"numeric"
      });

    }

    function updateDateDisplay(){

      dateDisplay.innerText = formatDate(workDate.value);

    }

    workDate.value =
      new Date().toISOString().split("T")[0];

    updateDateDisplay();

    function openDatePicker(event){

      if(event){
        event.preventDefault();
        event.stopPropagation();
      }

      try{
        if(typeof workDate.showPicker === "function"){
          workDate.showPicker();
          return;
        }
      }catch(error){
        console.log("showPicker unavailable:", error);
      }

      workDate.focus();
      workDate.click();

    }

    // The transparent date input sits over the visible date field,
    // so clicking the date field directly always invokes the native picker.
    dateEdit.addEventListener("click", openDatePicker);

    workDate.addEventListener("change", updateDateDisplay);

    /* ================= LOAD TASKS ================= */

    async function loadTasks() {

      const user = JSON.parse(localStorage.getItem("user"));

      const res = await fetch(`/tasks/${user.id}`);

      const tasks = await res.json();

      console.log(tasks);

      document.getElementById("taskCount").innerText = tasks.length;
      document.getElementById("taskTotal").innerText = tasks.length;

      const container = document.getElementById("tasks");

      container.innerHTML = "";

      if (!tasks.length) {

        container.innerHTML = `
          <tr>
            <td colspan="2" style="
              height:42px;
              color:#666;
              text-align:center;
            ">
              No tasks assigned
            </td>
          </tr>
        `;

        return;
      }

      tasks.forEach(task => {

        const row = document.createElement("tr");

        row.className = "task-card";

        row.innerHTML = `

          <td class="project-cell">
            <span class="task-name">${task.project}</span>

            <span
              class="task-task task-meta"
              aria-hidden="true"
            >${task.task}</span>

            <span
              class="task-client task-meta"
              aria-hidden="true"
            >${task.client}</span>
          </td>

          <td class="hours-cell">

            <div class="time-input">

              <input
                type="number"
                min="0"
                max="99"
                inputmode="numeric"
                placeholder="00"
                class="hrs"
                aria-label="Hours"
              >

              <span class="time-colon">:</span>

              <input
                type="number"
                min="0"
                max="59"
                inputmode="numeric"
                placeholder="00"
                class="mins"
                aria-label="Minutes"
              >

            </div>

          </td>

        `;

        container.appendChild(row);

      });

    }

    /* ================= TOTAL DISPLAY ================= */

    function updateTotalDisplay(totalMinutes){

      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      document.getElementById("totalDisplay").innerText =
        String(hours).padStart(2,"0") + ":" +
        String(minutes).padStart(2,"0");

    }

    /* ================= SUBMIT WORK ================= */

    async function submitWork() {

      const btn =
        document.getElementById("submitBtn");

      btn.disabled = true;
      btn.innerText = "Submitting...";

      const user =
        JSON.parse(localStorage.getItem("user"));

      const cards =
        document.querySelectorAll(".task-card");

      let tasks = [];

      let totalMinutes = 0;

      cards.forEach(card => {

        const taskName =
          card.querySelector(".task-name")?.innerText || "";

        const hrs =
          Number(card.querySelector(".hrs")?.value || 0);

        const mins =
          Number(card.querySelector(".mins")?.value || 0);

        totalMinutes +=
          (hrs * 60) + mins;

        if (taskName) {

          tasks.push({

            project:
              card.querySelector(".task-name").innerText,

            task:
              card.querySelector(".task-task").innerText,

            hrs: hrs,

            mins: mins

          });

        }

      });

      const note =
        document.getElementById("dayNote").value;

      await fetch('/submit', {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          action: "submit",

          user: user.id,

          tasks: tasks,

          note: note,

          workDate:
            document.getElementById("workDate").value

        })

      });

      document.querySelectorAll(".hrs")
        .forEach(i => i.value = "");

      document.querySelectorAll(".mins")
        .forEach(i => i.value = "");

      document.getElementById("dayNote").value = "";

      btn.innerText = "Submitted ✓";

      document.getElementById("totalHours").innerText =
        (totalMinutes / 60).toFixed(1);

      updateTotalDisplay(totalMinutes);

      alert("Submitted Successfully");

    }

    loadTasks();

  </script>

</body>
</html>
