<!DOCTYPE html>
<html>
<head>

  <title>Employee Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =====================================================
       PROFESSIONAL CORPORATE FONTS
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       CORPORATE OFFICE DESIGN SYSTEM
    ===================================================== */

    :root{

      /* Backgrounds */

      --page:#F5F5F3;
      --white:#FFFFFF;
      --surface:#FAFAF9;

      /* Text */

      --heading:#252525;
      --text:#303030;
      --secondary:#5F6368;
      --muted:#85898D;

      /* Borders */

      --border:#DDDFE2;
      --border-dark:#C9CCCF;

      /* Accent */

      --accent:#2F6B4F;
      --accent-dark:#285B43;
      --accent-soft:#EDF4EF;
      --accent-border:#D3E2D8;

      /* Table */

      --table-head:#303030;
      --table-total:#F0F0ED;

      /* Shadows */

      --shadow-sm:
        0 1px 3px rgba(0,0,0,.04);

      --shadow:
        0 4px 14px rgba(0,0,0,.06);

    }


    /* =====================================================
       RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    html{
      scroll-behavior:smooth;
    }


    body{

      font-family:'Inter',sans-serif;

      background:var(--page);

      color:var(--text);

      min-height:100vh;

      overflow-x:hidden;

      -webkit-font-smoothing:antialiased;

      text-rendering:optimizeLegibility;

    }


    button,
    input,
    textarea{

      font-family:'Inter',sans-serif;

    }


    button{

      -webkit-tap-highlight-color:transparent;

    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .main{

      width:100%;

      max-width:790px;

      margin:0 auto;

      padding:52px 34px 54px;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar{

      margin-bottom:40px;

      padding-bottom:24px;

      border-bottom:1px solid var(--border);

    }


    .topbar::before{

      content:"";

      display:block;

      width:34px;

      height:3px;

      background:var(--accent);

      margin-bottom:17px;

      border-radius:3px;

    }


    .topbar h1{

      font-family:'Manrope',sans-serif;

      font-size:42px;

      line-height:1.1;

      letter-spacing:-1.5px;

      font-weight:800;

      color:var(--heading);

    }


    /* =====================================================
       LABELS
    ===================================================== */

    .field-label,
    .projects-title{

      display:block;

      font-family:'Inter',sans-serif;

      font-size:13px;

      line-height:1.4;

      font-weight:600;

      color:var(--text);

      margin-bottom:8px;

      letter-spacing:.05px;

    }


    /* =====================================================
       DATE
    ===================================================== */

    .date-section{

      margin-bottom:27px;

    }


    .date-row{

      display:flex;

      align-items:center;

      gap:8px;

      position:relative;

    }


    .date-display{

      flex:1;

      min-width:0;

      height:44px;

      display:flex;

      align-items:center;

      padding:0 13px;

      background:var(--white);

      border:1px solid var(--border);

      border-radius:6px;

      font-size:14px;

      font-weight:500;

      color:var(--text);

      cursor:pointer;

      text-align:left;

      box-shadow:var(--shadow-sm);

      transition:

        border-color .18s ease,

        box-shadow .18s ease;

    }


    .date-display:hover{

      border-color:var(--border-dark);

      box-shadow:var(--shadow);

    }


    .date-display:focus{

      outline:none;

      border-color:#A7AAA8;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.08);

    }


    .date-edit{

      width:44px;

      height:44px;

      flex-shrink:0;

      display:flex;

      align-items:center;

      justify-content:center;

      border:1px solid var(--border);

      border-radius:6px;

      background:var(--white);

      cursor:pointer;

      box-shadow:var(--shadow-sm);

      transition:

        background .18s ease,

        border-color .18s ease;

    }


    .date-edit:hover{

      background:#F1F2F0;

      border-color:var(--border-dark);

    }


    .date-edit svg{

      width:18px;

      height:18px;

      stroke:#5F6368;

      stroke-width:1.8;

      fill:none;

    }


    #workDate{

      position:absolute;

      left:0;

      top:0;

      width:calc(100% - 52px);

      height:44px;

      opacity:0;

      cursor:pointer;

      z-index:5;

      border:0;

    }


    /* =====================================================
       DAY NOTE
    ===================================================== */

    .day-section{

      margin-bottom:29px;

    }


    #dayNote{

      display:block;

      width:100%;

      height:145px;

      padding:13px 14px;

      background:var(--white);

      border:1px solid var(--border);

      border-radius:6px;

      outline:none;

      resize:none;

      font-size:14px;

      line-height:1.6;

      font-weight:400;

      color:var(--text);

      box-shadow:var(--shadow-sm);

      transition:

        border-color .18s ease,

        box-shadow .18s ease;

    }


    #dayNote:hover{

      border-color:var(--border-dark);

    }


    #dayNote:focus{

      border-color:#A7AAA8;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.08);

    }


    #dayNote::placeholder{

      color:#A0A3A6;

    }


    /* =====================================================
       PROJECT SECTION
    ===================================================== */

    .projects-section{

      margin-bottom:30px;

    }


    .projects-table{

      width:100%;

      border-collapse:separate;

      border-spacing:0 5px;

    }


    .projects-table th,
    .projects-table td{

      height:42px;

      padding:6px 14px;

      text-align:left;

      vertical-align:middle;

      font-size:13px;

    }


    /* =====================================================
       TABLE HEADER
    ===================================================== */

    .projects-table th{

      height:40px;

      background:var(--table-head);

      color:#FFFFFF;

      font-size:12px;

      font-weight:600;

      letter-spacing:.2px;

      text-transform:uppercase;

    }


    .projects-table th:first-child{

      border-radius:5px 0 0 5px;

    }


    .projects-table th:last-child{

      border-radius:0 5px 5px 0;

    }


    .projects-table th:first-child,
    .projects-table td:first-child{

      width:65%;

    }


    .projects-table th:last-child,
    .projects-table td:last-child{

      width:35%;

    }


    /* =====================================================
       PROJECT ROWS
    ===================================================== */

    .projects-table tbody tr td{

      background:var(--white);

      border-top:1px solid var(--border);

      border-bottom:1px solid var(--border);

      transition:

        background .15s ease,

        border-color .15s ease;

    }


    .projects-table tbody tr td:first-child{

      border-left:1px solid var(--border);

      border-radius:5px 0 0 5px;

    }


    .projects-table tbody tr td:last-child{

      border-right:1px solid var(--border);

      border-radius:0 5px 5px 0;

    }


    .projects-table tbody tr:hover td{

      background:#FCFCFB;

      border-color:#D4D6D8;

    }


    .project-cell{

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

      color:var(--text);

      font-weight:500;

    }


    /* =====================================================
       HOURS INPUT
    ===================================================== */

    .hours-cell{

      padding:4px 8px !important;

    }


    .time-input{

      width:100%;

      height:32px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:#F7F7F6;

      border:1px solid var(--border);

      border-radius:5px;

      transition:

        border-color .18s ease,

        background .18s ease;

    }


    .time-input:focus-within{

      background:#FFFFFF;

      border-color:#AEB3B0;

      box-shadow:

        0 0 0 2px rgba(47,107,79,.06);

    }


    .time-input input{

      width:29px;

      height:26px;

      padding:0;

      border:0;

      outline:none;

      background:transparent;

      color:var(--text);

      font-size:13px;

      font-weight:600;

      text-align:center;

      -moz-appearance:textfield;

    }


    .time-input input::-webkit-outer-spin-button,
    .time-input input::-webkit-inner-spin-button{

      -webkit-appearance:none;

      margin:0;

    }


    .time-input input::placeholder{

      color:#A5A8AA;

      opacity:1;

    }


    .time-colon{

      margin:0 1px;

      color:#777C80;

      font-size:13px;

      font-weight:600;

    }


    /* =====================================================
       TOTAL
    ===================================================== */

    .total-row td{

      background:var(--table-total) !important;

      border-top:1px solid var(--border-dark) !important;

      border-bottom:1px solid var(--border-dark) !important;

      height:42px;

      color:var(--heading);

      font-weight:600;

    }


    .total-row td:first-child{

      border-left:1px solid var(--border-dark) !important;

      border-radius:5px 0 0 5px;

    }


    .total-row td:last-child{

      border-right:1px solid var(--border-dark) !important;

      border-radius:0 5px 5px 0;

    }


    .total-label{

      text-align:right !important;

      padding-right:14px !important;

      font-size:12px !important;

      text-transform:uppercase;

      letter-spacing:.35px;

      color:#5F6368;

    }


    .total-time{

      font-size:14px;

      font-weight:700;

      font-variant-numeric:tabular-nums;

      color:var(--heading);

    }


    /* =====================================================
       SUBMIT
    ===================================================== */

    .submit-btn{

      display:block;

      width:100%;

      height:45px;

      padding:0 18px;

      border:0;

      border-radius:6px;

      background:var(--accent);

      color:#FFFFFF;

      font-family:'Inter',sans-serif;

      font-size:14px;

      font-weight:600;

      letter-spacing:.1px;

      cursor:pointer;

      box-shadow:

        0 3px 8px rgba(47,107,79,.15);

      transition:

        background .18s ease,

        box-shadow .18s ease,

        transform .18s ease;

      margin-bottom:9px;

    }


    .submit-btn:hover{

      background:var(--accent-dark);

      transform:translateY(-1px);

      box-shadow:

        0 5px 12px rgba(47,107,79,.18);

    }


    .submit-btn:active{

      transform:translateY(0);

    }


    .submit-btn:disabled{

      opacity:.7;

      cursor:wait;

      transform:none;

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .bottom-buttons{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:9px;

    }


    .nav-btn{

      height:43px;

      border:1px solid var(--border);

      border-radius:6px;

      background:var(--white);

      color:#4D5154;

      font-size:13px;

      font-weight:600;

      cursor:pointer;

      box-shadow:var(--shadow-sm);

      transition:

        background .18s ease,

        border-color .18s ease,

        color .18s ease;

    }


    .nav-btn:hover{

      background:#F1F2F0;

      border-color:var(--border-dark);

      color:var(--heading);

    }


    .nav-btn:active{

      background:#EDEDEB;

    }


    /* =====================================================
       HIDDEN DATA
    ===================================================== */

    .task-meta{

      display:none;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:700px){

      .main{

        padding:44px 28px 45px;

      }


      .topbar h1{

        font-size:38px;

      }

    }


    @media(max-width:600px){

      .main{

        max-width:none;

        padding:36px 22px 40px;

      }


      .topbar{

        margin-bottom:32px;

      }


      .topbar h1{

        font-size:35px;

        letter-spacing:-1.2px;

      }


      #dayNote{

        height:135px;

      }


      .projects-table th,
      .projects-table td{

        padding-left:10px;

        padding-right:10px;

      }


      .projects-table th{

        font-size:11px;

      }


      .projects-table td{

        font-size:12px;

      }

    }


    @media(max-width:430px){

      .main{

        padding-left:16px;

        padding-right:16px;

      }


      .topbar h1{

        font-size:32px;

        letter-spacing:-1px;

      }


      .date-display{

        font-size:13px;

      }


      .projects-table{

        border-spacing:0 4px;

      }


      .projects-table th,
      .projects-table td{

        font-size:11px;

      }


      .projects-table th:first-child,
      .projects-table td:first-child{

        width:60%;

      }


      .projects-table th:last-child,
      .projects-table td:last-child{

        width:40%;

      }


      .time-input input{

        width:26px;

        font-size:12px;

      }


      .submit-btn{

        height:44px;

      }


      .nav-btn{

        height:42px;

        font-size:12px;

      }

    }


    /* =====================================================
       ACCESSIBILITY
    ===================================================== */

    @media(prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{

        transition:none !important;

        animation:none !important;

        scroll-behavior:auto !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN
  ===================================================== -->

  <div class="main">


    <!-- =====================================================
         GREETING
    ===================================================== -->

    <div class="topbar">

      <h1 id="welcomeText">
        Hey, Employee
      </h1>

    </div>


    <!-- =====================================================
         DATE
    ===================================================== -->

    <section class="date-section">

      <label class="field-label">
        Date
      </label>


      <div class="date-row">

        <div
          class="date-display"
          id="dateDisplay"
          aria-label="Change work date"
        >
          Loading date...
        </div>


        <button
          type="button"
          class="date-edit"
          id="dateEdit"
          aria-label="Edit date"
          title="Change date"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M12 20h9"></path>

            <path
              d="M16.5 3.5a2.121 2.121 0 0 1 3 3L8 18l-4 1 1-4Z"
            ></path>

          </svg>

        </button>


        <input
          type="date"
          id="workDate"
        >

      </div>

    </section>


    <!-- =====================================================
         DAY NOTE
    ===================================================== -->

    <section class="day-section">

      <label
        class="field-label"
        for="dayNote"
      >
        How was your day?
      </label>


      <textarea
        id="dayNote"
        placeholder="Add a brief note about your day..."
      ></textarea>

    </section>


    <!-- =====================================================
         PROJECTS
    ===================================================== -->

    <section class="projects-section">

      <label class="projects-title">
        How many hours spent on what projects?
      </label>


      <table class="projects-table">

        <thead>

          <tr>

            <th>
              Projects
            </th>

            <th>
              Hrs
            </th>

          </tr>

        </thead>


        <tbody id="tasks"></tbody>


        <tfoot>

          <tr class="total-row">

            <td class="total-label">
              Total
            </td>

            <td
              class="total-time"
              id="totalDisplay"
            >
              00:00
            </td>

          </tr>

        </tfoot>

      </table>


      <!-- Existing logic -->

      <span
        id="taskCount"
        class="task-meta"
      >
        0
      </span>


      <span
        id="taskTotal"
        class="task-meta"
      >
        0
      </span>


      <span
        id="totalHours"
        class="task-meta"
      >
        0
      </span>

    </section>


    <!-- =====================================================
         SUBMIT
    ===================================================== -->

    <button
      class="submit-btn"
      id="submitBtn"
      type="button"
      onclick="submitWork()"
    >
      Submit
    </button>


    <!-- =====================================================
         HISTORY / PROFILE
    ===================================================== -->

    <div class="bottom-buttons">

      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='history.html'"
      >
        History
      </button>


      <button
        class="nav-btn"
        type="button"
        onclick="window.location.href='profile.html'"
      >
        Profile
      </button>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT — ORIGINAL WORKFLOW
  ===================================================== -->

  <script>


    const user =
      JSON.parse(
        localStorage.getItem("user")
      );


    /* =====================================================
       USER
    ===================================================== */

    if(user){

      document.getElementById(
        "welcomeText"
      ).innerText =
        `Hey, ${user.id}`;

    }


    /* =====================================================
       DATE
    ===================================================== */

    const workDate =
      document.getElementById(
        "workDate"
      );


    const dateDisplay =
      document.getElementById(
        "dateDisplay"
      );


    const dateEdit =
      document.getElementById(
        "dateEdit"
      );


    function formatDate(dateString){

      if(!dateString) return "";


      const date =
        new Date(
          dateString +
          "T00:00:00"
        );


      return date.toLocaleDateString(
        "en-US",
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );

    }


    function updateDateDisplay(){

      dateDisplay.innerText =
        formatDate(
          workDate.value
        );

    }


    workDate.value =
      new Date()
        .toISOString()
        .split("T")[0];


    updateDateDisplay();


    function openDatePicker(event){

      if(event){

        event.preventDefault();

        event.stopPropagation();

      }


      try{

        if(
          typeof workDate.showPicker ===
          "function"
        ){

          workDate.showPicker();

          return;

        }

      }catch(error){

        console.log(
          "showPicker unavailable:",
          error
        );

      }


      workDate.focus();

      workDate.click();

    }


    dateEdit.addEventListener(
      "click",
      openDatePicker
    );


    workDate.addEventListener(
      "change",
      updateDateDisplay
    );


    /* =====================================================
       LOAD TASKS
    ===================================================== */

    async function loadTasks(){

      const user =
        JSON.parse(
          localStorage.getItem("user")
        );


      const res =
        await fetch(
          `/tasks/${user.id}`
        );


      const tasks =
        await res.json();


      console.log(tasks);


      document.getElementById(
        "taskCount"
      ).innerText =
        tasks.length;


      document.getElementById(
        "taskTotal"
      ).innerText =
        tasks.length;


      const container =
        document.getElementById(
          "tasks"
        );


      container.innerHTML = "";


      if(!tasks.length){

        container.innerHTML = `

          <tr>

            <td
              colspan="2"
              style="
                height:55px;
                color:#85898D;
                text-align:center;
                background:#FFFFFF;
                border:1px solid #DDDFE2;
                border-radius:5px;
              "
            >
              No tasks assigned
            </td>

          </tr>

        `;


        return;

      }


      tasks.forEach(task => {

        const row =
          document.createElement(
            "tr"
          );


        row.className =
          "task-card";


        row.innerHTML = `

          <td class="project-cell">

            <span class="task-name">
              ${task.project}
            </span>


            <span
              class="task-task task-meta"
              aria-hidden="true"
            >
              ${task.task}
            </span>


            <span
              class="task-client task-meta"
              aria-hidden="true"
            >
              ${task.client}
            </span>

          </td>


          <td class="hours-cell">

            <div class="time-input">

              <input
                type="number"
                min="0"
                max="99"
                inputmode="numeric"
                placeholder="00"
                class="hrs"
                aria-label="Hours"
              >


              <span class="time-colon">
                :
              </span>


              <input
                type="number"
                min="0"
                max="59"
                inputmode="numeric"
                placeholder="00"
                class="mins"
                aria-label="Minutes"
              >

            </div>

          </td>

        `;


        container.appendChild(
          row
        );

      });

    }


    /* =====================================================
       TOTAL DISPLAY
    ===================================================== */

    function updateTotalDisplay(
      totalMinutes
    ){

      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const minutes =
        totalMinutes % 60;


      document.getElementById(
        "totalDisplay"
      ).innerText =

        String(hours).padStart(
          2,
          "0"
        )

        +

        ":"

        +

        String(minutes).padStart(
          2,
          "0"
        );

    }


    /* =====================================================
       SUBMIT WORK
    ===================================================== */

    async function submitWork(){

      const btn =
        document.getElementById(
          "submitBtn"
        );


      btn.disabled = true;

      btn.innerText =
        "Submitting...";


      const user =
        JSON.parse(
          localStorage.getItem("user")
        );


      const cards =
        document.querySelectorAll(
          ".task-card"
        );


      let tasks = [];


      let totalMinutes = 0;


      cards.forEach(card => {

        const taskName =
          card.querySelector(
            ".task-name"
          )?.innerText || "";


        const hrs =
          Number(
            card.querySelector(
              ".hrs"
            )?.value || 0
          );


        const mins =
          Number(
            card.querySelector(
              ".mins"
            )?.value || 0
          );


        totalMinutes +=
          (hrs * 60) + mins;


        if(taskName){

          tasks.push({

            project:
              card.querySelector(
                ".task-name"
              ).innerText,


            task:
              card.querySelector(
                ".task-task"
              ).innerText,


            hrs:hrs,


            mins:mins

          });

        }

      });


      const note =
        document.getElementById(
          "dayNote"
        ).value;


      await fetch(
        "/submit",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },


          body:JSON.stringify({

            action:"submit",

            user:user.id,

            tasks:tasks,

            note:note,

            workDate:
              document.getElementById(
                "workDate"
              ).value

          })

        }
      );


      document
        .querySelectorAll(".hrs")
        .forEach(
          i => i.value = ""
        );


      document
        .querySelectorAll(".mins")
        .forEach(
          i => i.value = ""
        );


      document.getElementById(
        "dayNote"
      ).value = "";


      btn.innerText =
        "Submitted ✓";


      document.getElementById(
        "totalHours"
      ).innerText =
        (totalMinutes / 60)
          .toFixed(1);


      updateTotalDisplay(
        totalMinutes
      );


      alert(
        "Submitted Successfully"
      );

    }

    loadTasks();
