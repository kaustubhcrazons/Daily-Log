<!DOCTYPE html>
<html>

<head>

<title>Task History</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#f3f6fb;
padding:35px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
font-size:36px;
font-weight:800;
}

.history-container{
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:24px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.date-badge{
background:#eef2ff;
color:#4338ca;
padding:10px 18px;
border-radius:999px;
font-weight:600;
}

.hours{
background:#dcfce7;
color:#166534;
padding:10px 18px;
border-radius:999px;
font-weight:600;
}

.tasks{
background:#f8fafc;
padding:15px;
border-radius:14px;
white-space:pre-line;
line-height:1.8;
margin-bottom:15px;
}

.note{
background:#fff7ed;
padding:15px;
border-radius:14px;
color:#92400e;
}

.timestamp{
margin-top:15px;
font-size:13px;
color:#64748b;
}

.empty{
text-align:center;
padding:50px;
background:white;
border-radius:20px;
font-size:18px;
}

</style>

</head>

<body>

<div class="history-container">

<div class="header">

<h1>📋 Task History</h1>

<button onclick="window.location.href='dashboard.html'"
style="
border:none;
padding:12px 20px;
border-radius:12px;
background:#4f46e5;
color:white;
cursor:pointer;">
Back
</button>

</div>

<div id="historyData"></div>

</div>

<script>

const user =
JSON.parse(
localStorage.getItem("user")
);

async function loadHistory(){

const res = await fetch(
`/history/${user.id}`
);
const history =
await res.json();

console.log(
  "HISTORY DATA:",
  JSON.stringify(history,null,2)
);

const container =
document.getElementById("historyData");

if(history.length===0){

container.innerHTML=`
<div class="empty">
No submissions found
</div>
`;

return;
}

let html="";

if(!Array.isArray(history)){

  console.error(
  "API ERROR:",
  JSON.stringify(history,null,2)
);

  container.innerHTML=`
    <div class="empty">
      Failed to load history
    </div>
  `;

  return;
}

history.forEach(item=>{

html += `

<div class="card">

<div class="card-top">

<div class="date-badge">
📅 ${item.date}
</div>

<div class="hours">
⏱ ${item.hours}
</div>

</div>

<div class="tasks">
${item.tasks}
</div>

${
item.note
?
`
<div class="note">
📝 ${item.note}
</div>
`
:
""
}

<div class="timestamp">
Submitted on ${item.timestamp}
</div>

</div>

`;

});

container.innerHTML=html;

}

loadHistory();

</script>

</body>
</html>
